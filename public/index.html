<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MultiOne Belgium – chargeuses articulées et accessoires</title>
<meta name="description" content="Chargeuses articulées MultiOne et plus de 100 accessoires. Configurez votre machine et recevez une offre d’un partenaire officiel en Belgique.">

<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#0b4f9c;--night:#0e1f3a;--steel:#e7ebf0;--steel2:#cfd7e1;--ink:#17202e;--muted:#5d6b7e;--yellow:#ffc629;--white:#fff;--ok:#1f8a4c;--bad:#b42318;
  --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--body:'Barlow',Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-padding-top:116px}
body{margin:0;font:400 17px/1.55 var(--body);color:var(--ink);background:var(--white)}
img{max-width:100%;display:block}
a{color:var(--blue)}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--cond);font-weight:700;letter-spacing:.2px;line-height:1.02;margin:0}
h1{font-size:clamp(44px,7vw,92px)}h2,h1.h2{font-size:clamp(32px,4vw,48px)}h3{font-size:26px}
p{max-width:68ch}

/* barre du haut */
.top{position:sticky;top:0;z-index:30;background:var(--night);color:#fff;padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:22px;height:66px}
.top img{height:34px;background:#fff;border-radius:6px;padding:3px 6px;flex:none;max-width:none}
.top .wrap>a:first-child,.lang,.acc,.top .cta{flex:none}
.top nav{display:flex;gap:2px;flex:1}
.top nav a{color:#dbe5f2;text-decoration:none;font-family:var(--cond);font-size:19px;font-weight:600;padding:6px 10px;border-radius:6px;white-space:nowrap}
.top nav a.on,.top nav a:hover{color:#fff;background:rgba(255,255,255,.1)}
.lang{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:6px;overflow:hidden}
.lang button{background:none;border:0;color:#dbe5f2;padding:5px 9px;cursor:pointer;font-weight:600}
.lang button.on{background:#fff;color:var(--night)}
.cta{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:var(--night);border:0;border-radius:8px;padding:13px 22px;font-family:var(--cond);font-size:22px;font-weight:700;cursor:pointer;text-decoration:none}
.cta:hover{filter:brightness(1.05)}
.cta.small{font-size:18px;padding:8px 14px}
.btn2{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--blue);border:2px solid var(--blue);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none}
.util{background:#0a1629;border-bottom:1px solid rgba(255,255,255,.08)}
.top .util .wrap{height:36px;justify-content:flex-end;gap:14px}
.acc{color:#dbe5f2;text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap;padding:3px 6px;border-radius:5px}
.accw{position:relative}.acc{background:none;border:0;cursor:pointer;font:inherit}
.accm{display:none;position:absolute;right:0;top:32px;z-index:40;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);width:290px;padding:8px}
.accm.open{display:block}.accm a{display:block;text-decoration:none;color:var(--ink);padding:10px 12px;border-radius:8px}.accm a:hover{background:var(--steel)}
.accm b{display:block;font-family:var(--cond);font-size:20px;color:var(--night)}.accm small{color:var(--muted);font-size:13px}
.util .lang button{padding:2px 8px;font-size:13px}
.top nav .mobacc{display:none}
@media (max-width:900px){.top nav .mobacc{display:block;border-top:1px solid rgba(255,255,255,.15);margin-top:6px;padding-top:12px}}
.acc:hover{background:rgba(255,255,255,.1);color:#fff}
.menu-t{display:none;background:none;border:0;color:#fff;font-size:26px;cursor:pointer}

/* accueil */
.hero{background:var(--night);color:#fff;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:36px;padding-top:56px;padding-bottom:56px}
.hero p{font-size:21px;color:#c9d6ea;margin:20px 0 28px}
.hero .ph{position:relative;background:var(--steel);border-radius:18px;padding:26px}
.hero .ph .num{position:absolute;right:18px;top:-10px;font-family:var(--cond);font-weight:800;font-size:220px;line-height:1;color:var(--blue);opacity:.16;letter-spacing:-6px}
.hero .ph img{position:relative;width:100%;max-height:460px;object-fit:contain;mix-blend-mode:multiply}
.hero .facts{display:flex;gap:28px;margin:30px 0 0;flex-wrap:wrap}
.hero .facts div{font-size:15px;color:#aebfd8}.hero .facts b{display:block;font-family:var(--cond);font-size:34px;color:#fff}
section{padding:72px 0}
.sechead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.sechead p{margin:8px 0 0;color:var(--muted)}

/* series : le grand numero */
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.ser{position:relative;display:block;background:var(--steel);border-radius:14px;padding:18px 18px 16px;text-decoration:none;color:var(--ink);overflow:hidden;min-height:250px}
.ser .num{position:absolute;left:14px;top:-6px;font-family:var(--cond);font-weight:800;font-size:150px;line-height:1;color:var(--blue);opacity:.14;letter-spacing:-4px}
.ser img{position:relative;height:170px;width:100%;object-fit:contain;margin-top:10px;mix-blend-mode:multiply}
.ser b{position:relative;display:block;font-family:var(--cond);font-size:28px}
.ser small{position:relative;color:var(--muted)}
.ser:hover{background:var(--steel2)}

/* applications */
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.app{position:relative;display:block;border-radius:12px;overflow:hidden;aspect-ratio:4/3;text-decoration:none;color:#fff;background:var(--night)}
.app img{width:100%;height:100%;object-fit:cover;opacity:.78;transition:transform .4s}
.app:hover img{transform:scale(1.04)}
.app span{position:absolute;left:0;right:0;bottom:0;padding:14px;font-family:var(--cond);font-size:24px;font-weight:700;background:linear-gradient(transparent,rgba(14,31,58,.92))}
.app small{display:block;font-family:var(--body);font-size:14px;font-weight:400;color:#dbe5f2}

/* partenaires */
.band{background:var(--steel)}
.partners{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pt{background:#fff;border:2px solid transparent;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px}
.pt .lg{height:44px;display:flex;align-items:center}.pt .lg img{max-height:44px;max-width:170px;object-fit:contain}
.pt b{font-family:var(--cond);font-size:24px}.pt small{color:var(--muted)}
.pt .off{font-size:13px;color:var(--blue);font-weight:600}
button.pt{text-align:left;cursor:pointer;font:inherit;color:inherit}
button.pt.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,79,156,.15)}

/* fiches */
.crumb{font-size:15px;color:var(--muted);margin:22px 0 10px}.crumb a{color:var(--blue);text-decoration:none}
.mtop{display:grid;grid-template-columns:1.1fr 1fr;gap:34px;align-items:start;margin-bottom:30px}
.mtop .big{background:var(--steel);border-radius:16px;padding:20px}.mtop .big img{width:100%;max-height:420px;object-fit:contain;mix-blend-mode:multiply}
.spec{width:100%;border-collapse:collapse;font-size:16px;margin:16px 0}.spec td{padding:7px 8px;border-bottom:1px solid var(--steel)}
.spec td:first-child{color:var(--muted);width:52%}.spec td:last-child{font-weight:600}
details{border-top:1px solid var(--steel2);padding:14px 0}details summary{cursor:pointer;font-family:var(--cond);font-size:24px;font-weight:700}
.feat{columns:2;column-gap:28px;padding-left:20px}.feat li{break-inside:avoid;margin-bottom:4px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--steel2);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.card img{width:100%;height:170px;object-fit:cover;background:var(--steel)}
.card div{padding:12px 14px}.card b{display:block;font-family:var(--cond);font-size:22px;line-height:1.1}.card small{color:var(--muted)}
.lvl{display:inline-block;font-size:13px;font-weight:600;margin-top:4px}.lvl.very{color:var(--ok)}.lvl.ok{color:#9a6700}
.models{border:1px solid var(--steel2);border-radius:12px}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--steel)}.mrow:last-child{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}.chips span{background:var(--steel);border-radius:5px;padding:2px 8px;font-size:14px}
.pick{white-space:nowrap}

/* configurateur */
.steps{display:flex;gap:6px;margin:26px 0 22px;flex-wrap:wrap}
.steps button{background:var(--steel);border:0;border-radius:8px;padding:9px 14px;font-family:var(--cond);font-size:19px;font-weight:600;color:var(--muted);cursor:pointer}
.steps button b{display:inline-block;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--night);text-align:center;line-height:24px;margin-right:6px;font-size:16px}
.steps button.on{background:var(--night);color:#fff}.steps button.done{color:var(--blue)}
.cfg{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.sum{position:sticky;top:122px;background:var(--night);color:#fff;border-radius:14px;padding:18px}
.sum h3{font-size:26px;margin-bottom:8px}.sum .sph{background:var(--steel);border-radius:10px;margin:6px 0 10px}.sum img{height:150px;width:100%;object-fit:contain;mix-blend-mode:multiply}
.sum ul{margin:0;padding-left:18px;font-size:15px;color:#dbe5f2}.sum .empty{color:#aebfd8;font-size:15px}
.sum .cta{width:100%;justify-content:center;margin-top:14px}
.chooser{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.opt{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--steel2);border-radius:12px;padding:10px;cursor:pointer;text-align:left}
.opt.on{border-color:var(--blue);background:#f2f7fd}
.opt img{width:84px;height:66px;object-fit:cover;border-radius:6px;flex:none;background:var(--steel)}
.opt b{font-weight:600;font-size:15px;line-height:1.25}.opt small{display:block;color:var(--muted);font-size:13px}
.optlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.mchoice{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mchoice button{background:var(--steel);border:2px solid transparent;border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.mchoice button.on{border-color:var(--blue);background:#f2f7fd}
.mchoice img{height:120px;width:100%;object-fit:contain;mix-blend-mode:multiply}.mchoice b{font-family:var(--cond);font-size:22px;display:block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:#fff;border:1px solid var(--steel2);border-radius:20px;padding:6px 14px;cursor:pointer}.tabs button.on{background:var(--night);color:#fff;border-color:var(--night)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:15px;font-weight:600}
.form input,.form textarea{border:1px solid var(--steel2);border-radius:8px;padding:11px 12px;font-weight:400}
.form .full{grid-column:1/-1}
.consent{flex-direction:row!important;align-items:flex-start;font-weight:400!important;gap:10px!important}
.consent input{margin-top:4px}
.hp{position:absolute;left:-9999px}
.err{color:var(--bad);font-weight:600}
.navbtns{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.ok-box{background:var(--steel);border-radius:16px;padding:34px;text-align:center}.ok-box h2{margin-bottom:10px}.ok-box p{margin:0 auto 20px}

.tl{list-style:none;margin:0;padding:0;border-left:4px solid var(--blue)}
.tl li{display:grid;grid-template-columns:150px minmax(0,1fr) 220px;gap:24px;align-items:start;padding:0 0 34px 26px;position:relative}
.tl li::before{content:'';position:absolute;left:-12px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--yellow);border:4px solid var(--white)}
.tl .yr{font-family:var(--cond);font-weight:800;font-size:44px;line-height:1;color:var(--blue)}
.tl .yr.word{font-size:28px;line-height:1.1;padding-top:6px}
.tl h3{margin-bottom:6px}.tl p{margin:0;color:#34414f}
.tl img{background:var(--steel);border-radius:12px;padding:10px;height:140px;width:100%;object-fit:contain;mix-blend-mode:multiply}
@media (max-width:900px){.tl li{grid-template-columns:1fr;gap:6px}.tl img{height:120px;max-width:260px}.top .wrap{gap:12px}}
.evs{padding:26px 0 0}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;background:var(--yellow);color:var(--night);border-radius:16px;padding:20px 24px;margin-bottom:12px}
.ev img{width:220px;height:150px;object-fit:cover;border-radius:10px}
.ev h2{font-size:clamp(28px,3.4vw,42px);margin:4px 0 6px}.ev p{margin:0 0 8px}.ev .evd{font-size:18px}
.evtag{display:inline-block;background:var(--night);color:#fff;border-radius:6px;padding:3px 10px;font-weight:600;font-size:14px}
.ev.now .evtag{background:#b42318}
.evb{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px!important}.ev .cta{background:var(--night);color:#fff}
@media (max-width:700px){.ev{grid-template-columns:1fr}.ev img{width:100%;height:170px}}
.joinband{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;background:var(--night);color:#fff;border-radius:16px;padding:28px 32px}
.joinband p{color:#c9d6ea;margin:8px 0 0}
.benef{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.benef div{border-top:4px solid var(--blue);padding-top:14px}.benef .bn{font-family:var(--cond);font-weight:800;font-size:40px;color:var(--blue);opacity:.35;line-height:1}
.benef h3{margin:4px 0 6px}.benef p{margin:0;color:#34414f}
.prof{padding-left:20px;margin:0}.prof li{margin-bottom:8px}
.psteps{list-style:none;counter-reset:s;padding:0;margin:0}.psteps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:4px 12px;margin-bottom:14px}
.psteps li::before{content:counter(s);grid-row:span 2;width:36px;height:36px;border-radius:50%;background:var(--yellow);color:var(--night);font-family:var(--cond);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.psteps b{font-family:var(--cond);font-size:22px}.psteps span{color:#34414f}
@media (max-width:900px){#ptcols{grid-template-columns:1fr!important}}
.ckb{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;max-width:760px;margin:0 auto;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.28);padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ckb p{margin:0;flex:1;min-width:240px;font-size:15px}.ckb a{color:var(--blue)}.ckb .ckbtns{display:flex;gap:8px}
.ckb button{border-radius:8px;padding:10px 18px;font-weight:700;font-size:15px;cursor:pointer;border:2px solid var(--night)}
.ckb .ckno{background:#fff;color:var(--night)}.ckb .ckyes{background:var(--night);color:#fff}
footer{background:var(--night);color:#aebfd8;padding:40px 0 calc(40px + env(safe-area-inset-bottom));font-size:15px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}footer a{color:#dbe5f2}
.fimp{flex-basis:100%;font-size:14px;border-top:1px solid rgba(255,255,255,.12);padding-top:16px}.fimp:empty{display:none}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

@media (max-width:1180px){.top .cta.small{display:none}}
@media (max-width:1080px) and (min-width:901px){.top nav a{font-size:17px;padding:6px 7px}}
@media (max-width:900px){
  .hero .wrap,.mtop,.cfg{grid-template-columns:1fr}.hero .ph .num{font-size:150px}
  .sum{position:static}.feat{columns:1}
  .top nav{display:none;position:absolute;left:0;right:0;top:102px;background:var(--night);flex-direction:column;padding:10px 16px 16px}
  .top nav.open{display:flex}.menu-t{display:block;margin-left:auto}.top .cta{display:none}
  .form{grid-template-columns:1fr}.optlist{grid-template-columns:1fr}
  section{padding:48px 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="util"><div class="wrap"><div class="accw"><button class="acc" id="accL" type="button" aria-haspopup="true"></button><div class="accm" id="accM"></div></div><div class="lang" id="lang"></div></div></div><div class="wrap">
  <a href="#/" aria-label="Accueil"><img src="/assets/logo.png" alt="MultiOne Belgium Import"></a>

  <a class="cta small" href="#/configurer" id="topCta"></a>
  <button class="menu-t" id="menuT" aria-label="Menu">☰</button>
</div></header>
<main id="view"><div class="loading">…</div></main>
<footer><div class="wrap"><div><b style="color:#fff">MultiOne Belgium Import</b><br><span id="ftxt"></span></div> <div><a href="#" id="fck"></a> · <a href="https://app.multione.be" id="facc" rel="nofollow"></a> · <a href="#/devenir-distributeur" id="fjoin"></a> · <a href="#/contact">Contact</a> · <a href="#/vie-privee" id="fpriv"></a></div><div id="fimp" class="fimp"></div></div></footer>
